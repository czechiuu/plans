<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">扶稳单臂哑铃划船动作循环示意</title><desc id="desc">从扶稳，哑铃垂下到肘沿身体向后拉，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M70 78h57v89 M60 168h77 M233 163h40"/></g><g class="person a"><circle cx="151" cy="64" r="13"/><path d="M160 75l52 36 18 55 M160 75l-36 10-18-8 M212 111l-40 52 M212 111l-21 50 M164 163h22"/></g><g class="person b"><circle cx="151" cy="64" r="13"/><path d="M160 75l52 36 18 55 M160 75l-36 10-18-8 M212 111l-25 11-25-20 M212 111l-21 50 M155 100h20"/></g><text class="caption" x="16" y="189">扶稳，哑铃垂下 → 肘沿身体向后拉</text></svg>