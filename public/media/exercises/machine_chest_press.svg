<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">坐姿胸推动作循环示意</title><desc id="desc">从双手在胸侧到向前推，肘不过伸，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M67 67v84h92 M92 151v24 M269 64v108 M252 89h34"/></g><g class="person a"><circle cx="126" cy="73" r="13"/><path d="M125 87l3 53 29 14 31-3 M130 102l24-4 21 15 M268 112h-92"/></g><g class="person b"><circle cx="126" cy="73" r="13"/><path d="M125 87l3 53 29 14 31-3 M130 102l44-3 66 1 M268 112h-35"/></g><text class="caption" x="16" y="189">双手在胸侧 → 向前推，肘不过伸</text></svg>