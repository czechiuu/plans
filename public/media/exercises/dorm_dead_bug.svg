<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">死虫动作循环示意</title><desc id="desc">从对侧手脚抬起到慢慢伸远，再换边，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M52 171h225"/></g><g class="person a"><circle cx="159" cy="118" r="13"/><path d="M147 128l-52 24 M173 128l54 24 M132 132l-10-57 M188 132l10-57 M122 75l-8-18 M198 75l8-18"/></g><g class="person b"><circle cx="159" cy="118" r="13"/><path d="M147 128l-78 29 M173 128l38 42 M132 132l-55-56 M188 132l66-47 M76 75l-12-9 M254 85l14-7"/></g><text class="caption" x="16" y="189">对侧手脚抬起 → 慢慢伸远，再换边</text></svg>