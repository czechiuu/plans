<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">坐姿腿弯举动作循环示意</title><desc id="desc">从小腿自然下垂到缓慢向后弯小腿，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M70 66v93h144 M90 159v18 M224 120v44 M216 162h28"/></g><g class="person a"><circle cx="123" cy="70" r="13"/><path d="M124 85l5 54 57-8 5 39 M128 109l25 14"/></g><g class="person b"><circle cx="123" cy="70" r="13"/><path d="M124 85l5 54 57-8-35 30 M128 109l25 14"/></g><text class="caption" x="16" y="189">小腿自然下垂 → 缓慢向后弯小腿</text></svg>