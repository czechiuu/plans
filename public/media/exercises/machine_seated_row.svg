<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">坐姿划船动作循环示意</title><desc id="desc">从双臂向前握柄到肘向后贴近身体，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M76 151h86 M96 151v25 M266 72v97 M245 105h35"/></g><g class="person a"><circle cx="125" cy="71" r="13"/><path d="M126 85l-2 56 38 12 31-4 M125 98l48 8 53-8 M266 100h-36"/></g><g class="person b"><circle cx="125" cy="71" r="13"/><path d="M126 85l-2 56 38 12 31-4 M125 98l34 9 19-7 M266 100h-83"/></g><text class="caption" x="16" y="189">双臂向前握柄 → 肘向后贴近身体</text></svg>