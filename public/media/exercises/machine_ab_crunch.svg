<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">坐姿轻卷腹动作循环示意</title><desc id="desc">从坐稳，脊柱自然到胸廓缓慢靠近骨盆，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M80 61v91h131 M94 152v21 M211 117v45"/></g><g class="person a"><circle cx="140" cy="65" r="13"/><path d="M138 79l3 59 47 13 21-5 M140 100l30 20"/></g><g class="person b"><circle cx="184" cy="93" r="13"/><path d="M177 104l-39 34 50 13 21-5 M167 109l20 21"/></g><text class="caption" x="16" y="189">坐稳，脊柱自然 → 胸廓缓慢靠近骨盆</text></svg>