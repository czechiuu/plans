<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">地板哑铃卧推动作循环示意</title><desc id="desc">从肘轻触地到双臂向上推，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M47 162h246 M93 150h145"/></g><g class="person a"><circle cx="92" cy="138" r="13"/><path d="M105 142h115l29 15 M143 141l-2-30-27 14 M193 141l3-30 24 13 M125 126h12 M203 126h12"/></g><g class="person b"><circle cx="92" cy="138" r="13"/><path d="M105 142h115l29 15 M143 141l-2-77 M193 141l3-77 M125 64h32 M180 64h32"/></g><text class="caption" x="16" y="189">肘轻触地 → 双臂向上推</text></svg>