<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">高位下拉动作循环示意</title><desc id="desc">从双臂向上握杆到肘向下，杆至上胸，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M62 38h204 M164 38v120 M116 153h96 M134 153v22 M194 153v22"/></g><g class="person a"><circle cx="164" cy="82" r="13"/><path d="M164 96v51 M164 106l-40-62 M164 106l40-62 M164 147l-28 12 M164 147l28 12 M117 44h94"/></g><g class="person b"><circle cx="164" cy="82" r="13"/><path d="M164 96v51 M164 106l-30 8-10-18 M164 106l30 8 10-18 M164 147l-28 12 M164 147l28 12 M123 96h82"/></g><text class="caption" x="16" y="189">双臂向上握杆 → 肘向下，杆至上胸</text></svg>