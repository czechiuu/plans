<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">坐姿腿举动作循环示意</title><desc id="desc">从脚踩踏板，膝弯曲到伸腿但不锁膝，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M48 146h75l28-52 M49 146v29 M226 65v107 M214 65h24"/></g><g class="person a"><circle cx="136" cy="72" r="13"/><path d="M133 86l-20 40 30 8 32 19 44-18 M134 98l28 10"/></g><g class="person b"><circle cx="136" cy="72" r="13"/><path d="M133 86l-20 40 30 8 62 4 24-3 M134 98l28 10"/></g><text class="caption" x="16" y="189">脚踩踏板，膝弯曲 → 伸腿但不锁膝</text></svg>