<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">坐下起立动作循环示意</title><desc id="desc">从稳坐，脚踩地到脚发力平稳站起，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M107 126h101 M115 126v49 M200 126v49 M93 175h121"/></g><g class="person a"><circle cx="142" cy="70" r="13"/><path d="M143 84l16 43 42 0 M159 127l-8 42 M159 127l34 42 M145 102l39 18"/></g><g class="person b"><circle cx="167" cy="47" r="13"/><path d="M167 61v72 M167 133l-17 37 M167 133l27 37 M167 85l-29 39 M167 85l30 39"/></g><text class="caption" x="16" y="189">稳坐，脚踩地 → 脚发力平稳站起</text></svg>