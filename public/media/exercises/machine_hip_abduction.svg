<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">坐姿髋外展动作循环示意</title><desc id="desc">从双腿靠近到缓慢向两侧打开，循环演示。请以文字要领和现场器械为准。</desc><style>svg{background:#f4f0fc}.machine{fill:none;stroke:#b7accf;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#63539c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.a{animation:poseA 3.2s infinite}.b{animation:poseB 3.2s infinite}@keyframes poseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes poseB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.a,.b{animation:none}.b{opacity:0}}.caption{fill:#4b426c;font:12px system-ui,sans-serif}</style><g class="machine"><path d="M109 53h102v91 M108 146h104 M109 146v25 M211 146v25"/></g><g class="person a"><circle cx="160" cy="63" r="13"/><path d="M160 77v56 M160 96l-35 31 M160 96l35 31 M160 133l-15 35 M160 133l15 35"/></g><g class="person b"><circle cx="160" cy="63" r="13"/><path d="M160 77v56 M160 96l-35 31 M160 96l35 31 M160 133l-52 34 M160 133l52 34"/></g><text class="caption" x="16" y="189">双腿靠近 → 缓慢向两侧打开</text></svg>